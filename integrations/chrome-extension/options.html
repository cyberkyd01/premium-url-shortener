<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Premium URL Shortener — Options</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --card: #fff; --fg: #0f172a; --muted: #64748b; --border: #e2e8f0; --primary: #6366f1; --danger: #ef4444; --success: #10b981; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --card: #111827; --fg: #f1f5f9; --muted: #94a3b8; --border: #1f2937; --primary: #818cf8; } }
    body { margin: 0; padding: 18px; min-width: 380px; background: var(--bg); color: var(--fg); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 3px; text-transform: uppercase; letter-spacing: .04em; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg); font-size: 13px; }
    p.hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
    button { cursor: pointer; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 13px; background: var(--primary); color: #fff; margin-top: 14px; }
    #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
    #status.ok { color: var(--success); } #status.error { color: var(--danger); }
  </style>
</head>
<body>
  <h1>Premium URL Shortener</h1>
  <form id="form">
    <label for="siteUrl">Shortener URL</label>
    <input id="siteUrl" type="url" placeholder="https://sho.rt" required />
    <p class="hint">The address of your Premium URL Shortener installation.</p>
    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="pus_…" required autocomplete="off" />
    <p class="hint">Create one under Dashboard → Settings → API (needs <code>links.write</code> and <code>domains.read</code>).</p>
    <button type="submit">Save &amp; test</button>
    <div id="status"></div>
  </form>
  <script src="options.js"></script>
</body>
</html>
